# Prepared only, not deployed. Native Python avoids any Docker build requirement.
services:
  - type: web
    name: tomatocare-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: INFERENCE_RUNTIME
        value: onnx
      - key: MODEL_REPO_ID
        value: ThanhHai25/TomatoCare-UniRepLKNet-A
      - key: MODEL_REVISION
        value: main
      - key: ONNX_FILENAME
        value: best_unireplknet_a.onnx
      - key: ONNX_PROFILE
        value: default
      - key: CPU_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: /tmp/huggingface
      - key: CORS_ORIGINS
        sync: false
